name: HiringCafe (headed Chrome via Xvfb + Tailscale)

# Cloudflare blocks headless Chrome and datacenter IPs here: patchright runs a
# real headed Chrome inside Xvfb, routed through your Tailscale exit node.
# Scheduled on your Mac instead (scripts/mac-sync.sh, every 6 h): these sites
# block GitHub's datacenter IPs. Run this workflow by hand only if you've set
# up the Tailscale exit node (SETUP.md).
on:
  workflow_dispatch: {}

concurrency:
  group: hc-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TAILSCALE: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Install patchright + Xvfb
        run: |
          pip install patchright
          python3 -m patchright install chromium --with-deps
          sudo apt-get update -y && sudo apt-get install -y xvfb
      - name: Connect to Tailscale exit node
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=${{ vars.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=false"
      - name: Run HiringCafe feed (under Xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node run-hc.mjs --days 2 --pages 8 --hours 168
        env:
          HC_PYTHON: python3
      - name: Commit results
        if: always()
        run: scripts/commit-data.sh hc data/hiringcafe-feed.json data/scan-hc-heartbeat.json
