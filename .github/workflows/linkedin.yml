name: LinkedIn (public job search)

# LinkedIn's logged-out job search, a rotating batch of 6 queries per run
# (the full list cycles every few runs), paced seconds apart. If LinkedIn
# rate-limits the runner, the run stops early and the Sources panel says so.
on:
  schedule:
    - cron: '12 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: linkedin-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Fetch LinkedIn
        run: node fetch-linkedin-feed.mjs --days 2 --batch 6
      - name: Commit results
        if: always()
        run: scripts/commit-data.sh linkedin data/linkedin-feed.json data/scan-linkedin-heartbeat.json data/cache/linkedin-cursor.json
