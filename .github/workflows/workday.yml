name: Workday sweep

# ~13k Workday tenants, newest postings first. For a backfill, dispatch with
# search_text="internship|intern", since=45 and fresh=true: each term is a
# relevance-ordered search (a few pages per tenant instead of a date walk,
# which can't stop early past Workday's "30+ Days Ago" label). The sweep
# spans several runs; resumed runs keep its search terms.
on:
  schedule:
    - cron: '6-59/15 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Posted within N days'
        default: '1'
      search_text:
        description: 'Optional Workday keyword search; | separates terms (e.g. internship|intern)'
        default: ''
      fresh:
        description: 'Discard an unfinished sweep and start over with these settings'
        type: boolean
        default: false

concurrency:
  group: workday-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Run Workday sweep
        run: node run-workday.mjs
        env:
          WORKDAY_SINCE: ${{ inputs.since || '1' }}
          WORKDAY_SEARCH_TEXT: ${{ inputs.search_text || '' }}
          WORKDAY_FRESH: ${{ inputs.fresh || false }}
      - name: Commit results
        if: always()
        run: scripts/commit-data.sh workday data/
