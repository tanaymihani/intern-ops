name: NextPlay (startup jobs API, via Tailscale)

on:
  schedule:
    - cron: '33 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: nextplay-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TAILSCALE: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Connect to Tailscale exit node
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=${{ vars.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=false"
      - name: Run NextPlay feed
        run: node run-nextplay.mjs
      - name: Commit results
        if: always()
        run: scripts/commit-data.sh nextplay data/nextplay-feed.json data/scan-nextplay-heartbeat.json
