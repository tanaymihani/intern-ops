name: JobRight (your recommendations + company boards)

# Uses your JobRight login: the one saved on the site's Refresh page (fetched
# from /api/session with an HMAC proof), else the JOBRIGHT_COOKIE secret.
# Without a login it still checks the boards of companies it already knows.
# Recommendations are committed encrypted (FEED_KEY).
on:
  schedule:
    - cron: '48 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: jobright-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04  # pinned: headed Chrome + Xvfb deps; ubuntu-latest is moving to 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # newest data, not the commit that triggered this run (see scripts/commit-data.sh)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Install patchright
        run: |
          pip install patchright
          python3 -m patchright install chromium --with-deps
      - name: Run JobRight feed
        run: node run-jobright.mjs
        env:
          JOBRIGHT_COOKIE: ${{ secrets.JOBRIGHT_COOKIE }}
          FEED_KEY: ${{ secrets.FEED_KEY }}
          SESSION_SOURCE_URL: ${{ vars.SITE_URL }}
          HC_PYTHON: python3
      - name: Commit results
        if: always()
        run: scripts/commit-data.sh jobright data/
