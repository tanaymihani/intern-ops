name: Scheduler (backup for GitHub cron)

# GitHub's cron is unreliable for this repo (it never fired for the first
# days, then fired for a day and stopped again), so this keeps every scraper
# on its cadence: it dispatches a workflow whose last run is overdue by 20%
# of its interval (at least 5 min) — workflow_dispatch from GITHUB_TOKEN is
# allowed to start runs. While cron is healthy every workflow has run recently and this does
# nothing. It never retires: each run lasts ~5.5 h, then hands off to a
# fresh run; its own cron line re-arms the chain if a hand-off ever fails.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 */4 * * *'

concurrency:
  group: scheduler
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Dispatch due workflows, then hand off
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # workflow file → minutes between runs (same cadence as their cron lines)
          declare -A EVERY=(
            [scan.yml]=10 [workday.yml]=15 [tracked.yml]=15 [lists.yml]=30
            [linkedin.yml]=120 [jobright.yml]=120 [seeds.yml]=180
            [handshake.yml]=360 [liveness.yml]=360 [board-discovery.yml]=360
          )
          epoch() { date -d "$1" +%s 2>/dev/null || echo 0; }
          deadline=$(( $(date +%s) + 335 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            for wf in "${!EVERY[@]}"; do
              # An API hiccup must not look like "never ran" — skip this round instead.
              last=$(gh run list -R "$REPO" -w "$wf" -L 1 --json createdAt,status \
                -q '.[0] // empty | "\(.createdAt) \(.status)"') || continue
              created="${last%% *}"; status="${last##* }"
              age=999999
              [ -n "$created" ] && age=$(( $(date +%s) - $(epoch "$created") ))
              # queued / pending / in_progress all mean a run is already on its way;
              # the grace (20% of the interval, at least 5 min) lets a late cron run go first.
              due=$(( ${EVERY[$wf]} * 72 )); [ "$due" -lt $(( (${EVERY[$wf]} + 5) * 60 )) ] && due=$(( (${EVERY[$wf]} + 5) * 60 ))
              if { [ -z "$last" ] || [ "$status" = "completed" ]; } && [ "$age" -ge "$due" ]; then
                gh workflow run "$wf" -R "$REPO" && echo "$(date -u +%H:%M) dispatched $wf (last run ${age}s ago)"
              fi
            done
            sleep 120
          done
          for attempt in 1 2 3 4 5; do
            gh workflow run scheduler.yml -R "$REPO" && { echo "Handed off to a fresh scheduler run."; exit 0; }
            sleep 30
          done
          echo "::error::Could not start the next scheduler run — dispatch scheduler.yml by hand."
          exit 1
