# Title filter — `mode: classify` hands every decision to lib/classify.mjs:
# a posting passes when it is an internship / co-op AND is either AI/ML
# (machine learning, data science, research scientist, CV, NLP, LLM…) or
# Quant (quant research/trading/dev, strats, model risk…), or is a technical
# intern role at a known quant firm / AI-native company. Tracked companies
# below can set `category: quant | ai` to get the firm-level rule.
#   negative: extra vetoes on top of the classifier (substring match).
#   positive: extra allow-list (bypasses the classifier — keep it short).
title_filter:
  mode: classify
  negative:
    - Clearance
    - TS/SCI
    - Top Secret
    - Polygraph
  positive: []
# Legitimacy scoring (providers/_trust-validator.mjs) — built, tested, never
# enabled before now. Flags every scanned job with trustScore/trustFlags/
# trustLevel; never drops a posting, just surfaces the signal in the Jobs UI
# so you can judge for yourself. Rules: missing/invalid apply URL, known
# link-shortener domains, company-name ↔ hosting-domain mismatch (skipped
# for recognized ATS domains, since greenhouse.io/ashbyhq.com etc. never
# match the company name and that's normal, not suspicious).
trust_filter:
  enabled: true
